name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($PKG_TAG)."
            echo "::error::Run 'pnpm version:set <version>', commit, then tag the release commit."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm test:artifact

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/*.tgz
