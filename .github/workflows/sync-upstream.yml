name: Sync upstream

on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      release_version:
        description: Release commit version to publish, including history before the desktop baseline
        required: false
        type: string

concurrency:
  group: sync-deepseek-ai-deepseek-harness
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    name: Merge, verify, and publish upstream changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch upstream branch and tags
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --tags --prune

      - name: Merge upstream without overwriting the desktop overlay
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "::error::Upstream merge has conflicts. The desktop overlay was left unchanged."
            exit 1
          fi
          node apps/electron/scripts/sync-version.mjs
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- apps/electron/package.json pnpm-lock.yaml; then
            git add apps/electron/package.json pnpm-lock.yaml
            git commit -m "chore: follow upstream version"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized desktop overlay
        run: |
          pnpm --filter @deepseek-ai/dsh-electron test
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-electron build

      - name: Push verified merge
        id: push
        env:
          BEFORE: ${{ github.sha }}
        run: |
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run desktop CI
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop-ci.yml --ref main

      - name: Prepare GitHub-validated desktop release snapshots
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          first_desktop_commit=$(git log --reverse --format=%H -- apps/electron | head -n 1)
          if [ -z "$first_desktop_commit" ]; then
            echo "::error::Cannot locate the first desktop overlay commit."
            exit 1
          fi
          release_baseline=$(git rev-parse "${first_desktop_commit}^")
          if ! git merge-base --is-ancestor "$release_baseline" upstream/master; then
            echo "::error::Desktop release baseline is not an ancestor of upstream/master."
            exit 1
          fi

          # npm release validation is temporarily disabled. The exact upstream
          # commit subject and its CLI manifest are the release authority.
          # npm_versions="$RUNNER_TEMP/dsh-npm-versions.json"
          # npm view @deepseek-ai/dsh versions --json > "$npm_versions"
          # jq -e 'type == "array"' "$npm_versions" >/dev/null

          release_commits="$RUNNER_TEMP/dsh-release-commits.tsv"
          if [ -n "$REQUESTED_VERSION" ]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "::error::Requested release version $REQUESTED_VERSION is not valid semver."
              exit 1
            fi
            git log --reverse --format='%H%x09%s' upstream/master \
              | awk -F '\t' -v subject="release(dsh): $REQUESTED_VERSION" '$2 == subject' \
              > "$release_commits"
            if [ "$(wc -l < "$release_commits" | tr -d ' ')" != "1" ]; then
              echo "::error::Expected exactly one upstream release(dsh): $REQUESTED_VERSION commit."
              exit 1
            fi
          else
            git log --reverse --format='%H%x09%s' "$release_baseline..upstream/master" > "$release_commits"
          fi
          overlay_patch="$RUNNER_TEMP/electron-overlay.patch"
          git diff --binary upstream/master HEAD -- . ':(exclude)pnpm-lock.yaml' > "$overlay_patch"
          dispatches="$RUNNER_TEMP/desktop-release-dispatches.tsv"
          : > "$dispatches"

          while IFS=$'\t' read -r upstream_commit subject; do
            if [[ ! "$subject" =~ ^release\(dsh\):\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
              continue
            fi
            release_version="${BASH_REMATCH[1]}"
            manifest_version=$(git show "${upstream_commit}:apps/cli/package.json" | jq -er '.version')
            if [ "$manifest_version" != "$release_version" ]; then
              echo "::error::Release commit $upstream_commit declares $release_version but its CLI manifest declares $manifest_version."
              exit 1
            fi
            # npm validation is temporarily disabled.
            # if ! jq -e --arg version "$release_version" 'index($version) != null' "$npm_versions" >/dev/null; then
            #   echo "::notice::Waiting for @deepseek-ai/dsh@$release_version to appear on npm."
            #   continue
            # fi

            desktop_tag="electron-dsh-v${release_version}"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$desktop_tag" >/dev/null 2>&1; then
              snapshot_root=$(mktemp -d "$RUNNER_TEMP/dsh-electron-${release_version}.XXXXXX")
              snapshot_dir="$snapshot_root/tree"
              git worktree add --detach "$snapshot_dir" "$upstream_commit"
              git -C "$snapshot_dir" apply --index --3way "$overlay_patch"
              node "$snapshot_dir/apps/electron/scripts/sync-version.mjs"
              pnpm --dir "$snapshot_dir" install --lockfile-only --no-frozen-lockfile --ignore-scripts
              git -C "$snapshot_dir" add --all
              git -C "$snapshot_dir" commit \
                -m "release(electron): $release_version" \
                -m "Upstream-Commit: $upstream_commit"
              snapshot_commit=$(git -C "$snapshot_dir" rev-parse HEAD)
              git tag -a "$desktop_tag" \
                -m "Desktop release $release_version from upstream $upstream_commit" \
                "$snapshot_commit"
              git worktree remove "$snapshot_dir"
              git push origin "refs/tags/$desktop_tag"
            fi

            if gh release view "$desktop_tag" >/dev/null 2>&1; then
              continue
            fi
            if gh run list --workflow desktop-release.yml --limit 100 \
              --json displayTitle,status \
              --jq ".[] | select(.displayTitle == \"Desktop release $desktop_tag\" and .status != \"completed\")" \
              | grep -q .; then
              echo "::notice::Desktop release $desktop_tag is already queued or running."
              continue
            fi
            prerelease=false
            if [[ "$release_version" == *-* ]]; then prerelease=true; fi
            printf '%s\t%s\t%s\t%s\n' \
              "$desktop_tag" "$upstream_commit" "$release_version" "$prerelease" >> "$dispatches"
          done < "$release_commits"

          echo "dispatches=$dispatches" >> "$GITHUB_OUTPUT"

      - name: Publish matching desktop releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r desktop_tag upstream_commit release_version prerelease; do
            [ -n "$desktop_tag" ] || continue
            gh workflow run desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f tag="$desktop_tag" \
              -f upstream_commit="$upstream_commit" \
              -f version="$release_version" \
              -f prerelease="$prerelease"
          done < "${{ steps.releases.outputs.dispatches }}"
