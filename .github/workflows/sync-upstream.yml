name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-deepseek-ai-deepseek-harness
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    name: Merge upstream into develop and publish Beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Fetch upstream branch and tags
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --tags --prune
          git fetch origin develop --tags

      - name: Merge upstream with downstream conflict policy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git config merge.ours.driver true
          if ! git merge --no-edit upstream/master; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

            echo "Conflict files:"
            printf ' %s\n' "${conflicts[@]}"

            for file in "${conflicts[@]}"; do
              case "$file" in
                README.md|README.zh.md|README.i18n.yaml)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                AGENTS.md)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                pnpm-lock.yaml|pnpm-workspace.yaml)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  git merge --abort || true
                  echo "::error::Upstream merge has unresolved conflicts in $file. Manual resolution is required."
                  exit 1
                  ;;
              esac
            done

            if ! git diff --cached --quiet || [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                git merge --abort || true
                echo "::error::Upstream merge still has unresolved conflicts after automatic resolution."
                exit 1
              fi
              git commit --no-edit
            fi
          fi

          node apps/electron/scripts/restore-agents-downstream.mjs
          if ! git diff --quiet -- AGENTS.md; then
            git add AGENTS.md
            git commit -m "chore: restore AGENTS.downstream.md reference"
          fi

          node apps/electron/scripts/sync-version.mjs
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- apps/electron/package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            git add apps/electron/package.json pnpm-lock.yaml pnpm-workspace.yaml
            git commit -m "chore: follow upstream dependency state"
          fi

          if ! grep -q 'apps/\*' pnpm-workspace.yaml && ! grep -q 'apps/electron' pnpm-workspace.yaml; then
            echo "::error::pnpm workspace no longer includes apps/electron after upstream merge."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized desktop overlay
        run: |
          pnpm --filter @deepseek-ai/dsh-electron test
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-electron build

      - name: Push verified merge to develop
        id: push
        env:
          BEFORE: ${{ github.sha }}
        run: |
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:develop
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run desktop CI
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop-ci.yml --ref develop

      - name: Publish Beta release
        if: steps.push.outputs.changed == 'true'
        id: beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          beta_tag=$(node apps/electron/scripts/next-beta-tag.mjs)
          beta_version="${beta_tag#v}"
          node apps/electron/scripts/set-version.mjs "$beta_version"
          pnpm install --lockfile-only --no-frozen-lockfile
          git add apps/electron/package.json pnpm-lock.yaml
          git commit -m "release(electron): $beta_version"
          git tag -a "$beta_tag" -m "Beta desktop release $beta_version"
          git push origin HEAD:develop
          git push origin "$beta_tag"
          echo "tag=$beta_tag" >> "$GITHUB_OUTPUT"
          echo "version=$beta_version" >> "$GITHUB_OUTPUT"

      - name: Dispatch Beta desktop release build
        if: steps.beta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref develop \
            -f tag="${{ steps.beta.outputs.tag }}" \
            -f version="${{ steps.beta.outputs.version }}" \
            -f prerelease=true
