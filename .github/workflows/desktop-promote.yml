name: Desktop promote

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/package.json'
      - 'apps/electron/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: desktop-promote-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  promote:
    name: Create RC or Stable release tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Align Electron version with upstream and publish tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          upstream_version=$(node -p "require('./apps/cli/package.json').version")
          release_tag="v${upstream_version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release tag ${release_tag} already exists."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node apps/electron/scripts/set-version.mjs "$upstream_version"
          pnpm install --lockfile-only --no-frozen-lockfile
          git add apps/electron/package.json pnpm-lock.yaml
          git commit -m "release(electron): ${upstream_version}"
          git tag -a "$release_tag" -m "Desktop release ${upstream_version}"
          git push origin HEAD:main
          git push origin "$release_tag"

          prerelease=false
          if [[ "$upstream_version" == *-* ]]; then prerelease=true; fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Dispatch desktop release build
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run desktop-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="${{ steps.release.outputs.tag }}" \
            -f version="${{ steps.release.outputs.version }}" \
            -f prerelease="${{ steps.release.outputs.prerelease }}"
