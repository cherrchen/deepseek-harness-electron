name: Desktop promote

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/package.json'
      - 'apps/electron/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: desktop-promote-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  promote:
    name: Create RC or Stable release tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # desktop-release.yml runs from the release tag push; do not dispatch it here.
      - name: Align Electron version with upstream and publish tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          upstream_version=$(node -p "require('./apps/cli/package.json').version")
          release_tag="v${upstream_version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release tag ${release_tag} already exists."
            exit 0
          fi

          node apps/electron/scripts/set-version.mjs "$upstream_version"
          pnpm install --no-frozen-lockfile
          git add apps/electron/package.json pnpm-lock.yaml
          git commit -m "release(electron): ${upstream_version}"
          git tag -a "$release_tag" -m "Desktop release ${upstream_version}"
          git push origin HEAD:main
          git push origin "$release_tag"
