version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Upstream owns every dependency except the Electron packaging toolchain.
    allow:
      - dependency-name: "electron"
      - dependency-name: "electron-builder"
    groups:
      electron-toolchain:
        applies-to: "version-updates"
        patterns:
          - "electron"
          - "electron-builder"
      electron-toolchain-security:
        applies-to: "security-updates"
        patterns:
          - "electron"
          - "electron-builder"
    open-pull-requests-limit: 1
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    labels:
      - "kind/dependency"
      - "area/infra"

  # These ecosystems are inherited from upstream and advance through upstream sync.
  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
