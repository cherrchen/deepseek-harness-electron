[package]
name = "dsh-electron-network-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
if-addrs = "0.15"
url = "2"
rquickjs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
proxy-watch = { version = "=0.1.1", default-features = false, features = ["resolve", "linux-gnome", "linux-kde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_System_Memory"] }
