# Electron Host composition overlay: OS directory picking belongs to Electron Main.
# Disable auto (native/Koffi). Keep the browse Host backend so `directoryPicker`
# still exists for apiproxy inject; the Electron client fills directory-flow
# holes and calls Main's dialog (browse client is not mounted).
# Desktop brand occupants replace the upstream `DSH Local Build` shell fallbacks.
# Bundled runtime plugins are linked into `$DSH_HOME/profiles/node_modules`
# before Host start (see ensureRuntimePluginsLinked).
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: desktop-capabilities
      name: '@dsh-electron/dsh-electron-desktop-capabilities'
    - id: desktop-directory-picker
      name: '@dsh-electron/dsh-electron-ui-directory-picker'
    - id: desktop-ui-brand
      name: '@dsh-electron/dsh-electron-ui-brand'
    - id: git
      name: '@dsh-electron/dsh-plugin-git'
